apiVersion: apps/v1
kind: Deployment
metadata:
  name: query-service
  labels:
    app: query-service
spec:
  replicas: 1
  selector:
    matchLabels:
      app: query-service
  template:
    metadata:
      name: query-service
      labels:
        app: query-service
    spec:
      containers:
        - name: query-service
          image: ai-search-engine/query-service
          ports:
            - containerPort: 8087
          env:
            - name: QUERY_SERVICE_PORT
              value: "8087"

---
apiVersion: v1
kind: Service
metadata:
  name: query-service
spec:
  type: ClusterIP
  ports:
    - port: 8087
      targetPort: 8087
  selector:
    app: query-service
