apiVersion: apps/v1
kind: Deployment
metadata:
  name: search-service
  labels:
    app: search-service
spec:
  replicas: 1
  selector:
    matchLabels:
      app: search-service
  template:
    metadata:
      name: search-service
      labels:
        app: search-service
    spec:
      containers:
        - name: search-service
          image: ai-search-engine/search-service
          ports:
            - containerPort: 8088
          env:
            - name: SEARCH_SERVICE_PORT
              value: "8088"

---
apiVersion: v1
kind: Service
metadata:
  name: search-service
spec:
  type: ClusterIP
  ports:
    - port: 8088
      targetPort: 8088
  selector:
    app: search-service
