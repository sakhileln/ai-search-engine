apiVersion: apps/v1
kind: Deployment
metadata:
  name: config-service
  labels:
    app: config-service
spec:
  replicas: 1
  selector:
    matchLabels:
      app: config-service
  template:
    metadata:
      name: config-service
      labels:
        app: config-service
    spec:
      containers:
        - name: config-service
          image: ai-search-engine/config-service
          ports:
            - containerPort: 8082
          env:
            - name: CONFIG_SERVICE_PORT
              value: "8082"

---
apiVersion: v1
kind: Service
metadata:
  name: config-service
spec:
  type: ClusterIP
  ports:
    - port: 8082
      targetPort: 8082
  selector:
    app: config-service
