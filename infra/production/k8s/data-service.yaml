apiVersion: apps/v1
kind: Deployment
metadata:
  name: data-service
  labels:
    app: data-service
spec:
  replicas: 1
  selector:
    matchLabels:
      app: data-service
  template:
    metadata:
      name: data-service
      labels:
        app: data-service
    spec:
      containers:
        - name: data-service
          image: africa-south1-docker.pkg.dev/{{PROJECT_ID}}/ai-search-engine/data-service:latest
          ports:
            - containerPort: 8086
---
apiVersion: v1
kind: Service
metadata:
  name: data-service
spec:
  type: ClusterIP
  ports:
    - port: 8086
      targetPort: 8086
  selector:
    app: data-service
