syntax = "proto3";

package ai.search.auth;

import "common/common.proto";

option java_multiple_files = true;
option java_package = "ai.search.auth";
option java_outer_classname = "AuthProto";

service AuthService {
  // Authentication
  rpc Login(LoginRequest) returns (LoginResponse);
  rpc RefreshToken(RefreshTokenRequest) returns (RefreshTokenResponse);
  rpc Logout(LogoutRequest) returns (ai.search.common.StandardResponse);
  
  // Token validation
  rpc ValidateToken(ValidateTokenRequest) returns (ValidateTokenResponse);
  
  // Health check
  rpc Check(ai.search.common.HealthCheckRequest) returns (ai.search.common.HealthCheckResponse);
}

// Request/Response Messages
message LoginRequest {
  string username = 1;
  string password = 2;
  string client_id = 3;
  string client_secret = 4;
  map<string, string> metadata = 5;
}

message LoginResponse {
  string access_token = 1;
  string refresh_token = 2;
  int64 expires_in = 3;
  string token_type = 4;
  string user_id = 5;
  repeated string roles = 6;
  ai.search.common.Error error = 7;
}

message RefreshTokenRequest {
  string refresh_token = 1;
  string client_id = 2;
  string client_secret = 3;
}

message RefreshTokenResponse {
  string access_token = 1;
  string refresh_token = 2;
  int64 expires_in = 3;
  string token_type = 4;
  ai.search.common.Error error = 5;
}

message LogoutRequest {
  string access_token = 1;
  string refresh_token = 2;
  string user_id = 3;
}

message ValidateTokenRequest {
  string token = 1;
  repeated string required_roles = 2;
  repeated string required_permissions = 3;
}

message ValidateTokenResponse {
  bool valid = 1;
  string user_id = 2;
  repeated string roles = 3;
  map<string, string> claims = 4;
  ai.search.common.Error error = 5;
}
